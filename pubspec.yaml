name: loveping
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.12.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.2
  firebase_database: ^12.0.0

  # UI Packages
  google_fonts: ^6.3.2
  lottie: ^3.3.1

  # Media
  image_picker: ^1.1.2
  video_player: ^2.14.0
  shared_preferences: ^2.5.3

  # Networking / Cloudinary
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Launcher Icon
  flutter_launcher_icons: ^0.14.4

# ==================================================
# FLUTTER
# ==================================================

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

# ==================================================
# LOVE PING APP ICON
# ==================================================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/images/loveping_icon.png"

  # Android adaptive icon
  adaptive_icon_background: "#FFE5F0"
  adaptive_icon_foreground: "assets/images/loveping_icon.png"

  # Remove transparency issues on iOS
  remove_alpha_ios: true